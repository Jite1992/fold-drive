name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/**"
      - "!web/prices.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          elif [ -f android/signing/release.jks.b64 ]; then
            base64 -d android/signing/release.jks.b64 > "$RUNNER_TEMP/release.jks"
          fi
          if [ -f "$RUNNER_TEMP/release.jks" ]; then echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'folddrive-sideload' }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'folddrive-sideload' }}
          KEY_ALIAS: folddrive
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Save build log for fixing errors
        if: failure()
        run: |
          tail -n 500 build.log > /tmp/last-build.log 2>/dev/null || echo "No build log" > /tmp/last-build.log
          git config user.name "build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          cp /tmp/last-build.log last-build.log
          git add last-build.log
          git commit -m "Build log for run ${{ github.run_number }}"
          git push -f origin build-log

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk fold-drive.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fold Drive 1.0.${{ github.run_number }}
          body: |
            Install on the phone: download **fold-drive.apk** below, open it, and allow installing from this source if asked.
            Updating: install the new APK over the old one. Your data is kept.
          files: fold-drive.apk
          make_latest: true
