name: Update UAE fuel prices

on:
  schedule:
    # UAE prices are announced around the 28th-31st and apply from the 1st.
    # Times are UTC: 06:00 and 14:00 UTC = 10:00 and 18:00 in Dubai.
    - cron: "0 6,14 28-31 * *"
    - cron: "0 6,14 1-3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read this month's prices
        run: python scripts/update_prices.py
      - name: Save if changed
        run: |
          if git diff --quiet web/prices.json; then
            echo "No change to web/prices.json"
            exit 0
          fi
          git config user.name "fuel-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prices.json
          git commit -m "Update UAE fuel prices"
          git push
